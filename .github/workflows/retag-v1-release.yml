name: Retag v1.0.0 Release

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: v1.0.0
  TARGET_SHA: 767c52eb281ced5feee3c2a878e8ae1d865c5aa4

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Create automation app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name "app-version-updater-bot[bot]"
          git config user.email "3300059+app-version-updater-bot[bot]@users.noreply.github.com"

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi

      - name: Recreate release tag
        run: |
          set -euo pipefail
          git tag -d "$RELEASE_TAG" 2>/dev/null || true
          git push origin ":refs/tags/${RELEASE_TAG}" || true
          git tag "$RELEASE_TAG" "$TARGET_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          True Tile Renderer 1.0.0

          - Renders a true-tile outline for the local player at the server position.
          - Renders true-tile outlines for your current target or configured NPCs while preserving normal NPC clickboxes and interactions.
          - Mirrors combat overlays at the true tile for names, overheads, health bars, and hitsplats.
          - Includes the packaging and asset fixes used for the Plugin Hub submission.

          Pinned submission commit: 767c52eb281ced5feee3c2a878e8ae1d865c5aa4
          EOF

      - name: Create corrected release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
